name: Tests du noyau (Conda)

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Installer Conda et l'environnement
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: tgs-tests
      - name: Contrôle flake8 (erreurs bloquantes du dépôt QGIS)
        run: |
          flake8 GeoPhysiqueEnvironnement --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 GeoPhysiqueEnvironnement --count --exit-zero --max-line-length=127 --statistics
      - name: Tests du noyau de calcul
        # test_gui.py et test_workflows.py demandent QGIS : ils restent lancés en local.
        run: pytest -v GeoPhysiqueEnvironnement/tests/test_core.py
